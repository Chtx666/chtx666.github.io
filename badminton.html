<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球 · Letutakoff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Badminton page: green theme ── */
        :root {
            --page-accent: #34c759;
            --page-accent-dark: #248a3d;
        }

        ::selection { background: rgba(52, 199, 89, 0.15); }

        .scroll-progress {
            background: linear-gradient(90deg, #34c759, #0071e3, #5e5ce6);
        }

        .header-logo {
            background: linear-gradient(145deg, #30d158, #248a3d);
        }

        .hero-avatar {
            background: linear-gradient(145deg, #30d158, #248a3d, #1a7a30);
            box-shadow: 0 4px 24px rgba(48, 209, 88, 0.18);
        }

        .hero h1.gradient-text {
            background: linear-gradient(135deg, #30d158, #0071e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sec-label { color: var(--page-accent); }
        .sec-label::after {
            content: '';
            display: block;
            width: 32px;
            height: 2px;
            background: linear-gradient(90deg, var(--page-accent), transparent);
            margin-top: 6px;
            border-radius: 1px;
        }

        .contact-pill:hover i { color: var(--page-accent); }

        /* ── Racket Showcase ── */
        .racket-showcase {
            display: flex;
            gap: 48px;
            align-items: center;
            padding: 48px;
        }
        .racket-showcase:hover {
            transform: translateY(-3px) scale(1.005);
            box-shadow: var(--shadow-card-hover), var(--shadow-glow-green);
            border-color: rgba(52, 199, 89, 0.15);
        }

        .ribbon {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #30d158, #248a3d);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            box-shadow: 0 2px 12px rgba(48, 209, 88, 0.3);
            z-index: 1;
        }

        .racket-img-wrap {
            flex: 0 0 240px;
            height: 240px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f8fdf8, #eef7ee);
            padding: 32px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
            animation: floatImg 4s ease-in-out infinite;
        }
        @keyframes floatImg {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        .racket-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .racket-info { flex: 1; }
        .racket-info h3 {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }
        .racket-info .sub {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Spec table */
        .spec-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .spec-table td {
            font-size: 14px;
            padding: 10px 0;
            border-bottom: 0.5px solid var(--hairline);
        }
        .spec-table tr:last-child td { border-bottom: none; }
        .spec-table td:first-child {
            color: var(--text-secondary);
            font-weight: 500;
            width: 90px;
        }
        .spec-table td:last-child {
            color: var(--text);
            font-weight: 600;
        }

        @media (max-width: 760px) {
            .racket-showcase {
                flex-direction: column;
                text-align: center;
                padding: 36px 28px;
            }
            .racket-img-wrap {
                flex: 0 0 200px;
                width: 200px;
                height: 200px;
            }
            .spec-table td:first-child { width: 70px; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
        <div class="header-inner">
            <a href="./index.html" class="header-brand">
                <div class="header-logo"><i class="fas fa-feather-alt"></i></div>
                Letutakoff
            </a>
            <a href="./index.html" class="header-back"><i class="fas fa-arrow-left"></i> 返回</a>
        </div>
    </header>

    <main class="page-enter content-wrap">
        <section class="hero">
            <div class="container">
                <div class="hero-avatar"><i class="fas fa-feather-alt"></i></div>
                <h1 class="gradient-text">羽球</h1>
                <p class="tagline">每一次挥拍，都是与风的对话。</p>
            </div>
        </section>

        <div class="container sec-section">
            <div class="sec-label">Badminton</div>
            <h2 class="sec-title">主力战拍</h2>
            <p class="sec-desc">陪伴我在球场上的每一刻。</p>

            <div class="card racket-showcase reveal">
                <div class="ribbon">主力战拍</div>
                <div class="racket-img-wrap">
                    <img src="./images/yonex_logo.svg" alt="YONEX">
                </div>
                <div class="racket-info">
                    <h3>YONEX ASTROX 3DG ST</h3>
                    <p class="sub">天斧系列 · 进攻型</p>
                    <table class="spec-table">
                        <tr><td>拍框</td><td>碳素 + 钨</td></tr>
                        <tr><td>中杆</td><td>碳素 · NANOMESH NEO</td></tr>
                        <tr><td>手感</td><td>硬</td></tr>
                        <tr><td>规格</td><td>4U5</td></tr>
                        <tr><td>磅数</td><td>20–35 lbs</td></tr>
                        <tr><td>平衡</td><td>头重</td></tr>
                        <tr><td>长度</td><td>10mm 加长</td></tr>
                        <tr><td>颜色</td><td>黑 / 蓝</td></tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="contact-row">
                <a href="mailto:an_email666@qq.com" class="contact-pill"><i class="fas fa-envelope"></i> an_email666@qq.com</a>
                <a href="https://space.bilibili.com/3493275306560179?spm_id_from=333.1007.0.0" target="_blank" rel="noopener" class="contact-pill"><i class="fab fa-bilibili"></i> Bilibili</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Letutakoff. All rights reserved.</p>
        <p>贡献者：Letutakoff、Guashark</p>
    </footer>

    <script>
    (function() {
        var bar = document.getElementById('scrollProgress');
        if (bar) {
            window.addEventListener('scroll', function() {
                var st = window.pageYOffset || document.documentElement.scrollTop;
                var h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                bar.style.width = (st / h * 100) + '%';
            });
        }
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
    })();
    </script>
</body>
</html>
