<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About · Letutakoff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f7; --card: #ffffff;
            --accent: #0071e3; --indigo: #5e5ce6;
            --text: #1d1d1f; --text-secondary: #86868b;
            --text-tertiary: #aeaeb2;
            --hairline: rgba(0,0,0,0.06);
            --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.03);
            --card-hover-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 12px 36px rgba(0,0,0,0.06);
            --radius: 20px;
            --transition: cubic-bezier(0.22, 0.61, 0.36, 1);
            --glow: rgba(0, 113, 227, 0.08);
        }

        html { background: var(--bg); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.016em; line-height: 1.47059;
        }

        /* ── Page Load Entrance ── */
        .page-enter {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeSlideUp 0.7s var(--transition) forwards;
        }
        @keyframes fadeSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Scroll Reveal ── */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s var(--transition), transform 0.6s var(--transition);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Background Depth Glow ── */
        main::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        main {
            position: relative;
        }

        a { text-decoration: none; color: var(--accent); }
        .container { max-width: 660px; margin: 0 auto; padding: 0 28px; }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(245,245,247,0.72);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 1px solid var(--hairline);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 48px; max-width: 660px; margin: 0 auto; padding: 0 28px;
        }
        .header-name { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
        .header-back { font-size: 13px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 5px; transition: color .2s; }
        .header-back:hover { color: var(--text); }

        .hero { padding: 150px 0 60px; text-align: center; }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(145deg, #478ed8, #0071e3, #1662b7);
            box-shadow: 0 2px 16px rgba(0,113,227,0.15);
            margin: 0 auto 20px; display: flex; align-items: center;
            justify-content: center; font-size: 28px; color: #fff;
        }
        .hero h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.032em; }
        .hero .tagline { font-size: 18px; color: var(--text-secondary); margin-top: 6px; letter-spacing: 0.008em; }

        .info-block {
            background: var(--card); border-radius: var(--radius);
            padding: 40px; margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .info-block::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(180deg, rgba(0,113,227,0.2) 0%, transparent 40%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s var(--transition);
            pointer-events: none;
        }
        .info-block:hover::before {
            opacity: 1;
        }
        .info-block:hover {
            box-shadow: var(--card-hover-shadow), 0 0 40px var(--glow);
        }
        .info-block h3 {
            font-size: 22px; font-weight: 700; letter-spacing: -0.018em;
            margin-bottom: 20px;
        }

        .info-line {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 0; border-bottom: 1px solid var(--hairline);
            font-size: 15px;
        }
        .info-line:last-child { border-bottom: none; }
        .info-line .lbl { color: var(--text-secondary); }
        .info-line .val { color: var(--text); font-weight: 500; }

        .contributor-row {
            display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
            margin-top: 8px;
        }
        .contributor {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 24px; border-radius: 980px;
            background: var(--bg); font-size: 14px; font-weight: 500;
            color: var(--text);
            transition: background 0.35s var(--transition), color 0.35s var(--transition), box-shadow 0.35s var(--transition);
        }
        .contributor:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px rgba(0,113,227,0.2);
        }
        .contributor i { font-size: 17px; color: var(--indigo); }

        .about-text {
            color: var(--text-secondary); font-size: 15px;
            line-height: 1.75; max-width: 440px; margin: 0 auto;
        }

        /* ── Info Block Stagger Delays ── */
        .reveal:nth-child(1) { transition-delay: 0s; }
        .reveal:nth-child(2) { transition-delay: 0.1s; }
        .reveal:nth-child(3) { transition-delay: 0.2s; }

        footer {
            text-align: center; padding: 36px;
            border-top: 1px solid var(--hairline); background: var(--card); margin-top: 80px;
        }
        footer p { font-size: 12px; color: var(--text-tertiary); }

        @media (max-width: 500px) {
            .hero h1 { font-size: 36px; }
            .info-block { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="./index.html" class="header-name">Letutakoff</a>
            <a href="./index.html" class="header-back"><i class="fas fa-arrow-left"></i> 返回</a>
        </div>
    </header>

    <main class="page-enter">
        <section class="hero">
            <div class="avatar"><i class="fas fa-feather-alt"></i></div>
            <h1>About</h1>
            <p class="tagline">关于这个网站，和背后的人。</p>
        </section>

        <div class="container" style="padding-bottom: 48px;">
            <div class="info-block reveal">
                <h3>权利保留</h3>
                <div class="info-line">
                    <span class="lbl">&copy; 所有权利保留</span>
                    <span class="val">Letutakoff</span>
                </div>
            </div>

            <div class="info-block reveal">
                <h3>贡献者</h3>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 18px;">感谢每一位为本网站做出贡献的朋友</p>
                <div class="contributor-row">
                    <div class="contributor"><i class="fas fa-user"></i> Letutakoff</div>
                    <div class="contributor"><i class="fas fa-user"></i> Guashark</div>
                </div>
            </div>

            <div class="info-block reveal">
                <h3>关于本站</h3>
                <p class="about-text">
                    这是 Letutakoff 的个人主页。记录热爱的羽球、痴迷的 ACG 世界，以及用代码构建的创造。设计遵循简洁、优雅与克制的表达。
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Letutakoff. 保留所有权利。</p>
    </footer>

    <script>
    (function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('.reveal').forEach(function(el) {
            observer.observe(el);
        });
    })();
    </script>
</body>
</html>
