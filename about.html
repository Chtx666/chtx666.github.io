<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About · Letutakoff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── About page: indigo theme ── */
        :root {
            --page-accent: #5e5ce6;
        }

        ::selection { background: rgba(94, 92, 230, 0.15); }

        .scroll-progress {
            background: linear-gradient(90deg, #5e5ce6, #0071e3, #bf5af2);
        }

        .header-logo {
            background: linear-gradient(145deg, #5e5ce6, #3a36d6);
        }

        .hero-avatar {
            background: linear-gradient(145deg, #5e5ce6, #3a36d6, #2e2cc8);
            box-shadow: 0 4px 24px rgba(94, 92, 230, 0.2);
        }

        .hero h1.gradient-text {
            background: linear-gradient(135deg, #5e5ce6, #0071e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* About page doesn't use sec-label/sections, so no label styles needed */

        /* ── Info Blocks ── */
        .info-blocks {
            padding-bottom: 48px;
        }
        .info-block {
            padding: 44px 40px;
            margin-bottom: 18px;
        }
        .info-block:hover {
            transform: translateY(-2px) scale(1.005);
            box-shadow: var(--shadow-card-hover), var(--shadow-glow-indigo);
        }

        /* Left accent bar per block */
        .info-block::after {
            content: '';
            position: absolute;
            left: 0;
            top: 20px;
            bottom: 20px;
            width: 3px;
            border-radius: 0 2px 2px 0;
        }
        .info-block:nth-child(1)::after {
            background: linear-gradient(180deg, #0071e3, #5e5ce6);
        }
        .info-block:nth-child(2)::after {
            background: linear-gradient(180deg, #5e5ce6, #bf5af2);
        }
        .info-block:nth-child(3)::after {
            background: linear-gradient(180deg, #bf5af2, #ff375f);
        }

        .info-block h3 {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
        }

        .info-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 0.5px solid var(--hairline);
            font-size: 15px;
        }
        .info-line:last-child { border-bottom: none; }
        .info-line .lbl { color: var(--text-secondary); font-weight: 500; }
        .info-line .val { color: var(--text); font-weight: 700; }

        /* ── Contributor Pills ── */
        .contributor-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .contributor {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px 10px 10px;
            border-radius: var(--radius-pill);
            background: var(--bg);
            border: 1px solid var(--hairline);
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            transition: all 0.4s var(--spring);
        }
        .contributor:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 24px rgba(0, 113, 227, 0.18);
            transform: translateY(-2px);
        }
        .contributor-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        .contributor:nth-child(1) .contributor-avatar {
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
        }
        .contributor:nth-child(2) .contributor-avatar {
            background: linear-gradient(135deg, #ff9500, #ff375f);
        }

        /* ── Quote ── */
        .about-quote {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
            font-style: italic;
            position: relative;
            padding: 0 20px;
        }
        .about-quote::before {
            content: '\201C';
            font-size: 56px;
            color: var(--page-accent);
            opacity: 0.18;
            position: absolute;
            top: -20px;
            left: -6px;
            font-style: normal;
            line-height: 1;
        }

        .about-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .info-block { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
        <div class="header-inner">
            <a href="./index.html" class="header-brand">
                <div class="header-logo"><i class="fas fa-circle-info"></i></div>
                Letutakoff
            </a>
            <a href="./index.html" class="header-back"><i class="fas fa-arrow-left"></i> 返回</a>
        </div>
    </header>

    <main class="page-enter content-wrap">
        <section class="hero">
            <div class="container">
                <div class="hero-avatar"><i class="fas fa-feather-alt"></i></div>
                <h1 class="gradient-text">About</h1>
                <p class="tagline">关于这个网站，和背后的人。</p>
            </div>
        </section>

        <div class="container info-blocks">
            <div class="card info-block reveal">
                <h3>权利保留</h3>
                <div class="info-line">
                    <span class="lbl">&copy; 所有权利保留</span>
                    <span class="val">Letutakoff</span>
                </div>
            </div>

            <div class="card info-block reveal">
                <h3>贡献者</h3>
                <p class="about-subtitle">感谢每一位为本网站做出贡献的朋友</p>
                <div class="contributor-row">
                    <div class="contributor">
                        <div class="contributor-avatar">L</div>
                        Letutakoff
                    </div>
                    <div class="contributor">
                        <div class="contributor-avatar">G</div>
                        Guashark
                    </div>
                </div>
            </div>

            <div class="card info-block reveal">
                <h3>关于本站</h3>
                <p class="about-quote">
                    这是 Letutakoff 的个人主页。记录热爱的羽球、痴迷的 ACG 世界，以及用代码构建的创造。设计遵循简洁、优雅与克制的表达。
                </p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Letutakoff. All rights reserved.</p>
    </footer>

    <script>
    (function() {
        var bar = document.getElementById('scrollProgress');
        if (bar) {
            window.addEventListener('scroll', function() {
                var st = window.pageYOffset || document.documentElement.scrollTop;
                var h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                bar.style.width = (st / h * 100) + '%';
            });
        }
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
    })();
    </script>
</body>
</html>
