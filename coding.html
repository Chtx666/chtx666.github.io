<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding · Letutakoff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Coding page: blue theme ── */
        :root {
            --page-accent: #0a84ff;
        }

        ::selection { background: rgba(0, 113, 227, 0.18); }

        .scroll-progress {
            background: linear-gradient(90deg, #0a84ff, #5e5ce6, #ff9500);
        }

        .header-logo {
            background: linear-gradient(145deg, #0a84ff, #0071e3);
        }

        .hero-avatar {
            background: linear-gradient(145deg, #0a84ff, #0071e3, #0060c0);
            box-shadow: 0 8px 32px rgba(0, 113, 227, 0.24),
                        inset 0 2px 4px rgba(255, 255, 255, 0.35),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.08);
        }

        .hero h1.gradient-text {
            background: linear-gradient(135deg, #0a84ff, #5e5ce6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sec-label { color: var(--page-accent); }
        .sec-label::after {
            content: '';
            display: block;
            width: 32px;
            height: 2px;
            background: linear-gradient(90deg, var(--page-accent), transparent);
            margin-top: 6px;
            border-radius: 1px;
        }

        .contact-pill:hover i { color: var(--accent); }

        /* ── Project Cards — Liquid Glass ── */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .project-card {
            padding: 36px 40px;
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }
        .project-card:hover {
            transform: translateY(-4px) scale(1.008);
            box-shadow: var(--shadow-glass-hover), var(--shadow-glow-blue),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        /* Left accent bar — liquid glow */
        .project-card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 20px;
            bottom: 20px;
            width: 3px;
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 12px currentColor;
        }
        .project-card[data-theme="maple"]::after {
            background: linear-gradient(180deg, #ff9500, #e55b00);
            color: rgba(255, 149, 0, 0.4);
        }
        .project-card[data-theme="github"]::after {
            background: linear-gradient(180deg, #2d2d2f, #1d1d1f);
            color: rgba(45, 45, 47, 0.3);
        }

        .proj-icon {
            flex: 0 0 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15),
                        inset 0 2px 3px rgba(255, 255, 255, 0.35),
                        inset 0 -2px 3px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 1;
        }
        .proj-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
            pointer-events: none;
        }
        .icon-maple { background: linear-gradient(145deg, #ff9500, #e55b00); }
        .icon-gh    { background: linear-gradient(145deg, #2d2d2f, #1d1d1f); }

        .proj-info { flex: 1; position: relative; z-index: 1; }
        .proj-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .proj-header h4 {
            font-family: var(--font-display);
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .proj-info > p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .proj-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .project-card {
                flex-direction: column;
                text-align: center;
                padding: 28px 24px;
            }
            .proj-icon { margin: 0 auto; }
            .proj-tags { justify-content: center; }
            .btn-group { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="site-header">
        <div class="header-inner">
            <a href="./index.html" class="header-brand">
                <div class="header-logo"><i class="fas fa-code"></i></div>
                Letutakoff
            </a>
            <a href="./index.html" class="header-back"><i class="fas fa-arrow-left"></i> 返回</a>
        </div>
    </header>

    <main class="page-enter content-wrap">
        <section class="hero">
            <div class="container">
                <div class="hero-avatar"><i class="fas fa-feather-alt"></i></div>
                <h1 class="gradient-text">Coding</h1>
                <p class="tagline">用代码构建秩序，在逻辑中寻找美感。</p>
            </div>
        </section>

        <div class="container sec-section">
            <div class="sec-label">Projects</div>
            <h2 class="sec-title">代码作品</h2>
            <p class="sec-desc">将想法转化为可运行的创造。</p>

            <div class="project-list">
                <div class="card project-card reveal" data-theme="maple">
                    <div class="proj-icon icon-maple"><i class="fas fa-leaf"></i></div>
                    <div class="proj-info">
                        <div class="proj-header">
                            <h4>Maple</h4>
                            <span class="live-badge">Live</span>
                        </div>
                        <div class="proj-tags">
                            <span class="tag"><i class="fas fa-cube"></i> Godot</span>
                            <span class="tag"><i class="fas fa-music"></i> 音频</span>
                            <span class="tag"><i class="fas fa-eye"></i> 视觉</span>
                            <span class="tag"><i class="fas fa-gamepad"></i> 交互</span>
                        </div>
                        <p>基于 Godot 引擎的交互式多媒体项目，融合视觉特效、音频处理与实时交互。</p>
                        <div class="btn-group">
                            <a href="./Maple/index.html" class="btn btn-primary" target="_blank"><i class="fas fa-play"></i> 启动</a>
                        </div>
                    </div>
                </div>

                <div class="card project-card reveal" data-theme="github">
                    <div class="proj-icon icon-gh"><i class="fab fa-github"></i></div>
                    <div class="proj-info">
                        <div class="proj-header">
                            <h4>GitHub</h4>
                        </div>
                        <div class="proj-tags">
                            <span class="tag"><i class="fas fa-code-branch"></i> 开源</span>
                            <span class="tag"><i class="fas fa-terminal"></i> 代码</span>
                        </div>
                        <p>更多项目与代码片段，欢迎访问我的 GitHub 主页。</p>
                        <div class="btn-group">
                            <a href="#" class="btn btn-outline"><i class="fab fa-github"></i> 访问</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="contact-row">
                <a href="mailto:an_email666@qq.com" class="contact-pill"><i class="fas fa-envelope"></i> an_email666@qq.com</a>
                <a href="https://space.bilibili.com/3493275306560179?spm_id_from=333.1007.0.0" target="_blank" rel="noopener" class="contact-pill"><i class="fab fa-bilibili"></i> Bilibili</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Letutakoff. All rights reserved.</p>
        <p>贡献者：Letutakoff、Guashark</p>
    </footer>

    <script>
    (function() {
        var bar = document.getElementById('scrollProgress');
        if (bar) {
            window.addEventListener('scroll', function() {
                var st = window.pageYOffset || document.documentElement.scrollTop;
                var h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                bar.style.width = (st / h * 100) + '%';
            });
        }
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
    })();
    </script>
</body>
</html>
