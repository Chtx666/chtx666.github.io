<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding · Letutakoff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f5f7; --card: #ffffff;
            --accent: #0071e3; --blue: #0071e3;
            --text: #1d1d1f; --text-secondary: #86868b;
            --text-tertiary: #aeaeb2;
            --hairline: rgba(0,0,0,0.06);
            --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.03);
            --card-hover-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 12px 36px rgba(0,0,0,0.06);
            --radius: 20px;
            --transition: cubic-bezier(0.22, 0.61, 0.36, 1);
            --glow: rgba(0, 113, 227, 0.08);
        }

        html { background: var(--bg); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.016em; line-height: 1.47059;
        }

        /* ── Page Load Entrance ── */
        .page-enter {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeSlideUp 0.7s var(--transition) forwards;
        }
        @keyframes fadeSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Scroll Reveal ── */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s var(--transition), transform 0.6s var(--transition);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Background Depth Glow ── */
        main::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        main {
            position: relative;
        }

        a { text-decoration: none; color: var(--accent); }
        .container { max-width: 780px; margin: 0 auto; padding: 0 28px; }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(245,245,247,0.72);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 1px solid var(--hairline);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            height: 48px; max-width: 780px; margin: 0 auto; padding: 0 28px;
        }
        .header-name { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
        .header-back { font-size: 13px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 5px; transition: color .2s; }
        .header-back:hover { color: var(--text); }

        .hero { padding: 140px 0 56px; text-align: center; }
        .avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(145deg, #478ed8, #0071e3, #1662b7);
            box-shadow: 0 2px 16px rgba(0,113,227,0.15);
            margin: 0 auto 20px; display: flex; align-items: center;
            justify-content: center; font-size: 28px; color: #fff;
        }
        .hero h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.032em; }
        .hero .tagline { font-size: 18px; color: var(--text-secondary); margin-top: 6px; letter-spacing: 0.008em; }

        .sec-label {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--blue); margin-bottom: 8px;
        }
        .sec-title { font-size: 32px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.12; margin-bottom: 6px; }
        .sec-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 36px; }

        .project-list { display: flex; flex-direction: column; gap: 14px; }

        .project-card {
            background: var(--card); border-radius: var(--radius);
            padding: 32px 36px; display: flex; gap: 28px; align-items: center;
            box-shadow: var(--card-shadow);
            transition: transform 0.55s var(--transition), box-shadow 0.55s var(--transition);
            position: relative;
            overflow: hidden;
        }
        .project-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(180deg, rgba(0,113,227,0.25) 0%, transparent 40%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s var(--transition);
            pointer-events: none;
        }
        .project-card:hover::before {
            opacity: 1;
        }
        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-hover-shadow), 0 0 40px var(--glow);
        }

        .proj-icon {
            flex: 0 0 56px; height: 56px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff;
        }
        .icon-maple { background: linear-gradient(145deg, #ff9500, #e55b00); }
        .icon-gh { background: linear-gradient(145deg, #2d2d2f, #1d1d1f); }

        .proj-info { flex: 1; }
        .proj-info h4 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .proj-info p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 14px; }

        .proj-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .proj-tag {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; color: var(--text-secondary);
            background: var(--bg); padding: 4px 10px;
            border-radius: 980px;
        }
        .proj-tag i { font-size: 10px; opacity: 0.6; }
        .proj-tag:hover {
            background: var(--accent);
            color: #fff;
        }
        .proj-tag:hover i { opacity: 1; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 20px; border-radius: 980px;
            font-size: 14px; font-weight: 500;
            transition: all 0.35s var(--transition);
            border: none; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #0077ed; }
        .btn-outline { background: transparent; color: var(--accent); border: 1px solid rgba(0,113,227,0.3); }
        .btn-outline:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: #0077ed; box-shadow: 0 0 20px rgba(0,113,227,0.2); }

        .contact-pill {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 980px;
            background: var(--card); box-shadow: var(--card-shadow);
            font-size: 14px; color: var(--text-secondary);
            transition: all 0.35s var(--transition);
        }
        .contact-pill:hover { transform: translateY(-1px); box-shadow: var(--card-hover-shadow); color: var(--text); }
        .contact-pill:hover i { color: var(--accent); }
        .contact-pill i { transition: color 0.3s var(--transition); font-size: 16px; }

        /* ── Card Stagger Delays ── */
        .reveal:nth-child(1) { transition-delay: 0s; }
        .reveal:nth-child(2) { transition-delay: 0.1s; }

        footer {
            text-align: center; padding: 36px;
            border-top: 1px solid var(--hairline); background: var(--card); margin-top: 80px;
        }
        footer p { font-size: 12px; color: var(--text-tertiary); }
        footer p + p { margin-top: 2px; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 36px; }
            .project-card { flex-direction: column; text-align: center; padding: 28px 24px; }
            .proj-tags { justify-content: center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="./index.html" class="header-name">Letutakoff</a>
            <a href="./index.html" class="header-back"><i class="fas fa-arrow-left"></i> 返回</a>
        </div>
    </header>

    <main class="page-enter">
        <section class="hero">
            <div class="container">
                <div class="avatar"><i class="fas fa-feather-alt"></i></div>
                <h1>Coding</h1>
                <p class="tagline">用代码构建秩序，在逻辑中寻找美感。</p>
            </div>
        </section>

        <div class="container" style="padding-bottom: 48px;">
            <div class="sec-label">Projects</div>
            <h2 class="sec-title">代码作品</h2>
            <p class="sec-desc">将想法转化为可运行的创造。</p>

            <div class="project-list">
                <div class="project-card reveal">
                    <div class="proj-icon icon-maple"><i class="fas fa-leaf"></i></div>
                    <div class="proj-info">
                        <h4>Maple</h4>
                        <div class="proj-tags">
                            <span class="proj-tag"><i class="fas fa-cube"></i> Godot</span>
                            <span class="proj-tag"><i class="fas fa-music"></i> 音频</span>
                            <span class="proj-tag"><i class="fas fa-eye"></i> 视觉</span>
                            <span class="proj-tag"><i class="fas fa-gamepad"></i> 交互</span>
                        </div>
                        <p>基于 Godot 引擎的交互式多媒体项目，融合视觉特效、音频处理与实时交互。</p>
                        <a href="./Maple/index.html" class="btn btn-primary" target="_blank"><i class="fas fa-play"></i> 启动</a>
                    </div>
                </div>

                <div class="project-card reveal">
                    <div class="proj-icon icon-gh"><i class="fab fa-github"></i></div>
                    <div class="proj-info">
                        <h4>GitHub</h4>
                        <div class="proj-tags">
                            <span class="proj-tag"><i class="fas fa-code-branch"></i> 开源</span>
                            <span class="proj-tag"><i class="fas fa-terminal"></i> 代码</span>
                        </div>
                        <p>更多项目与代码片段，欢迎访问我的 GitHub 主页。</p>
                        <a href="#" class="btn btn-outline"><i class="fab fa-github"></i> 访问</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="container" style="padding: 40px 0 48px;">
            <div class="contact-row">
                <a href="mailto:an_email666@qq.com" class="contact-pill"><i class="fas fa-envelope"></i> an_email666@qq.com</a>
                <a href="https://space.bilibili.com/3493275306560179?spm_id_from=333.1007.0.0" target="_blank" rel="noopener" class="contact-pill"><i class="fab fa-bilibili"></i> Bilibili</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Letutakoff. All rights reserved.</p>
        <p>贡献者：Letutakoff、Guashark</p>
    </footer>

    <script>
    (function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('.reveal').forEach(function(el) {
            observer.observe(el);
        });
    })();
    </script>
</body>
</html>
