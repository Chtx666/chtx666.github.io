<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letutakoff</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .main-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 32px 60px;
            position: relative;
            z-index: 1;
        }

        /* Avatar with liquid pulse rings */
        .avatar-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        .avatar-main {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: linear-gradient(145deg, #478ed8, #0071e3, #1662b7);
            box-shadow: 0 8px 32px rgba(0, 113, 227, 0.22),
                        inset 0 2px 4px rgba(255, 255, 255, 0.35),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            transition: transform 0.6s var(--spring);
            position: relative;
            z-index: 1;
        }
        .avatar-main::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }
        .avatar-main:hover { transform: scale(1.06) rotate(-3deg); }

        .avatar-ring {
            position: absolute;
            width: 104px;
            height: 104px;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 113, 227, 0.14);
            animation: ringPulse 3.5s ease-out infinite;
            z-index: 0;
        }
        .avatar-ring:nth-child(2) { animation-delay: 1.75s; }

        @keyframes ringPulse {
            0%   { transform: scale(1);   opacity: 0.5; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            margin-bottom: 10px;
            text-wrap: balance;
            background: linear-gradient(135deg, #0071e3 0%, #5e5ce6 50%, #af52de 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 60px;
        }
        .divider::before, .divider::after {
            content: '';
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--hairline-strong));
        }
        .divider::after { background: linear-gradient(90deg, var(--hairline-strong), transparent); }
        .divider i {
            font-size: 6px;
            color: var(--text-tertiary);
            animation: dividerPulse 2s ease-in-out infinite;
        }
        @keyframes dividerPulse {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 0.8; }
        }

        .subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.005em;
        }

        /* ── Navigation Grid — Liquid Glass Cards ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            max-width: 920px;
            width: 100%;
        }

        .grid-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%) brightness(1.06);
            -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.06);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 38px 24px 34px;
            text-align: center;
            box-shadow: var(--shadow-glass),
                        inset 0 1px 1px rgba(255, 255, 255, 0.5),
                        inset 0 -1px 1px rgba(255, 255, 255, 0.15);
            transition: transform 0.6s var(--ease-liquid),
                        box-shadow 0.6s var(--ease-liquid),
                        background 0.6s var(--ease-liquid);
            color: var(--text);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* Specular highlight */
        .grid-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 25%, transparent 50%, transparent 75%, rgba(255,255,255,0.06) 100%);
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.6s var(--ease-liquid);
        }

        /* Dynamic edge ring on hover */
        .grid-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.15) 30%, transparent 50%, rgba(255,255,255,0.15) 70%, rgba(255,255,255,0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s var(--ease-liquid);
        }

        .grid-card:hover {
            transform: translateY(-6px) scale(1.02);
            background: var(--glass-bg-hover);
        }
        .grid-card:hover::before { opacity: 0.9; }
        .grid-card:hover::after { opacity: 1; }

        .grid-card[data-accent="green"]:hover  { box-shadow: var(--shadow-glass-hover), var(--shadow-glow-green),  inset 0 1px 1px rgba(255,255,255,0.6); }
        .grid-card[data-accent="purple"]:hover { box-shadow: var(--shadow-glass-hover), var(--shadow-glow-purple), inset 0 1px 1px rgba(255,255,255,0.6); }
        .grid-card[data-accent="blue"]:hover   { box-shadow: var(--shadow-glass-hover), var(--shadow-glow-blue),   inset 0 1px 1px rgba(255,255,255,0.6); }
        .grid-card[data-accent="indigo"]:hover { box-shadow: var(--shadow-glass-hover), var(--shadow-glow-indigo), inset 0 1px 1px rgba(255,255,255,0.6); }

        .grid-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            margin: 0 auto 18px;
            transition: transform 0.5s var(--spring);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12),
                        inset 0 1px 2px rgba(255, 255, 255, 0.35),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.08);
        }
        .grid-card:hover .grid-icon { transform: scale(1.12) translateY(-2px); }

        .icon-green  { background: linear-gradient(145deg, #30d158, #248a3d); }
        .icon-purple { background: linear-gradient(145deg, #bf5af2, #9b3ed6); }
        .icon-blue   { background: linear-gradient(145deg, #0a84ff, #0071e3); }
        .icon-indigo { background: linear-gradient(145deg, #5e5ce6, #3a36d6); }

        .grid-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
            position: relative;
            z-index: 1;
        }
        .grid-card p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 800px) {
            .grid { grid-template-columns: repeat(2, 1fr); max-width: 420px; }
            .hero-title { font-size: 44px; }
            .avatar-main { width: 88px; height: 88px; font-size: 34px; }
            .avatar-ring { width: 88px; height: 88px; }
        }
        @media (max-width: 440px) {
            .grid { grid-template-columns: 1fr; max-width: 280px; }
            .hero-title { font-size: 36px; }
            .subtitle { font-size: 17px; }
            .avatar-main { width: 76px; height: 76px; font-size: 28px; }
            .avatar-ring { width: 76px; height: 76px; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="main-wrap page-enter">
        <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <div class="avatar-ring"></div>
            <div class="avatar-main"><i class="fas fa-feather-alt"></i></div>
        </div>
        <h1 class="hero-title">Letutakoff</h1>
        <p class="subtitle">代码构建秩序，热爱点燃生活。</p>
        <div class="divider"><i class="fas fa-circle"></i></div>

        <div class="grid">
            <a href="./badminton.html" class="grid-card reveal" data-accent="green">
                <div class="grid-icon icon-green"><i class="fas fa-table-tennis-paddle-ball"></i></div>
                <h3>羽球</h3>
                <p>YONEX · ASTROX 3DG ST</p>
            </a>
            <a href="./anime.html" class="grid-card reveal" data-accent="purple">
                <div class="grid-icon icon-purple"><i class="fas fa-ghost"></i></div>
                <h3>二次元</h3>
                <p>电锯人 · 五等分 · EVA · 奥特曼</p>
            </a>
            <a href="./coding.html" class="grid-card reveal" data-accent="blue">
                <div class="grid-icon icon-blue"><i class="fas fa-code"></i></div>
                <h3>Coding</h3>
                <p>Maple · GitHub</p>
            </a>
            <a href="./about.html" class="grid-card reveal" data-accent="indigo">
                <div class="grid-icon icon-indigo"><i class="fas fa-circle-info"></i></div>
                <h3>About</h3>
                <p>权利 · 贡献者</p>
            </a>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Letutakoff. All rights reserved.</p>
        <p>贡献者：Letutakoff、Guashark</p>
    </footer>

    <script>
    (function() {
        var bar = document.getElementById('scrollProgress');
        if (bar) {
            window.addEventListener('scroll', function() {
                var st = window.pageYOffset || document.documentElement.scrollTop;
                var h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                bar.style.width = (st / h * 100) + '%';
            });
        }
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
    })();
    </script>
</body>
</html>
